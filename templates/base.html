<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AHP–COS Safety Decision Support System{% endblock %}</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Custom CSS -->
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body>
    <div class="d-flex" id="wrapper">
        <!-- Sidebar Navigation -->
        <nav class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h4 class="mb-0">
                    <i class="bi bi-shield-check"></i> Safety System
                </h4>
            </div>
            
            <ul class="nav flex-column mt-4">
                <li class="nav-item">
                    <a class="nav-link {% if request.endpoint == 'index' %}active{% endif %}" href="/">
                        <i class="icon-home"></i> Home
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.endpoint == 'ahp' %}active{% endif %}" href="/ahp">
                        <i class="icon-analysis"></i> AHP Analysis
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.endpoint == 'cos' %}active{% endif %}" href="/cos">
                        <i class="icon-budget"></i> COS Budgeting
                    </a>
                    <ul class="nav flex-column ms-3 mt-1">
                        <li class="nav-item">
                            <a class="nav-link {% if request.endpoint == 'equipment_ahp' %}active{% endif %} py-1" href="/equipment-ahp">Equipment AHP</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link {% if request.endpoint == 'equipment_cos' %}active{% endif %} py-1" href="/equipment-cos">Equipment Budgeting</a>
                        </li>
                    </ul>
                </li>
            </ul>
        </nav>

        <!-- Main Content -->
        <div id="page-content-wrapper" class="flex-grow-1">
            <!-- Top Navigation Bar -->
            <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom sticky-top">
                <div class="container-fluid">
                    <span class="navbar-brand mb-0 h1">
                        <strong>AHP–COS Safety Decision Support System</strong>
                    </span>
                    <button class="btn btn-outline-secondary d-lg-none" id="sidebarToggle">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                </div>
            </nav>

            <!-- Page Content -->
            <main class="container-fluid py-5">
                {% block content %}{% endblock %}
            </main>

            <!-- Footer -->
            <footer class="bg-light border-top mt-5 py-4">
                <div class="container-fluid text-center text-muted">
                    <p class="mb-0">AHP–COS Safety Decision Support System | Final Year Project</p>
                </div>
            </footer>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Sidebar Toggle Script -->
    <script>
        document.getElementById('sidebarToggle').addEventListener('click', function() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('show');
        });
        
        // Close sidebar when clicking on a link (for mobile)
        document.querySelectorAll('.nav-link').forEach(link => {
            link.addEventListener('click', function() {
                const sidebar = document.getElementById('sidebar');
                if (window.innerWidth < 992) {
                    sidebar.classList.remove('show');
                }
            });
        });
    </script>
    
    {% block scripts %}{% endblock %}
</body>
</html>
